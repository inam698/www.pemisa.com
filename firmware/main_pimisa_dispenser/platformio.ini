[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform   = espressif32
board      = esp32dev
framework  = arduino
monitor_speed = 115200
upload_port  = COM3
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    chris--a/Keypad@^3.1.1
