; PlatformIO Project Configuration for Pimisa Oil Dispenser
; ESP32 Dev Module

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM3
upload_speed = 115200
upload_flags =
    --before=default_reset
    --after=hard_reset

; Library dependencies
lib_deps =
    bblanchon/ArduinoJson@^7
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    chris--a/Keypad@^3.1.1

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
