; ============================================================
; PIMISA IoT Cooking Oil Dispenser - PlatformIO Configuration
; Board: ESP32 Dev Module
; Connectivity: SIM800L GSM/GPRS (no WiFi)
; ============================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform   = espressif32
board      = esp32dev
framework  = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; Upload settings
upload_port  = COM3
upload_speed = 115200
upload_flags =
    --before=default_reset
    --after=hard_reset

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_LOOP_STACK_SIZE=8192
    ; Uncomment to disable debug output for production:
    ; -DDEBUG_DISABLED

; Required libraries
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    chris--a/Keypad@^3.1.1

; Filesystem (SPIFFS) for offline queue storage
board_build.filesystem = spiffs
board_build.partitions = default.csv

; Extra scripts for SPIFFS upload
; Run: pio run --target uploadfs   (to upload filesystem)

[env:esp32dev_release]
extends = env:esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_LOOP_STACK_SIZE=8192
    -DDEBUG_DISABLED
    -Os
